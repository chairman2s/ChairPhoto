name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    # Green in well under a minute; the cap is here so a wedged `npm ci` fails fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  backend:
    name: Backend (tests + feature gating)
    runs-on: ubuntu-latest
    # A green run finishes in ~5 minutes warm, well under 20 cold. Without a cap, a hung
    # step (apt has stalled here for hours) holds the runner until the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # ChairPhoto links LibRaw at build time and shells out to the metadata/image
      # tools at runtime. See the Requirements section of the README.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libraw-dev clang pkg-config \
            libimage-exiftool-perl exiv2 ffmpeg imagemagick

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The model-dependent tests (faces) auto-skip when the ONNX models are absent,
      # so this stays offline-safe on a clean runner.
      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Check (incl. test-only code)
        working-directory: src-tauri
        run: cargo check --all-targets

      # AI must stay optional — this is the invariant that keeps the feature gating honest.
      - name: Check without default features
        working-directory: src-tauri
        run: cargo check --no-default-features

      # Single-feature checks catch hidden coupling between optional backends. Cargo's default
      # and all-feature builds can both pass while `--features smarttags` alone fails.
      - name: Check individual backend features
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          for feature in ai edit raw instagram collage slideshow localsend map faces smarttags flickr smugmug; do
            echo "::group::cargo check --no-default-features --features ${feature} --all-targets"
            cargo check --no-default-features --features "${feature}" --all-targets
            echo "::endgroup::"
          done

      # The tree is rustc-warning-clean and should stay that way.
      - name: Deny rustc warnings
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets

# Note: the `faces-cuda` / `smarttags-cuda` features are deliberately not built here —
# they require an NVIDIA toolchain no standard runner has. Verify those locally with
# `cargo check --all-features --all-targets`.
