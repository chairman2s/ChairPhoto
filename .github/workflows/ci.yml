name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (tests + feature gating)
    runs-on: ubuntu-latest
    # A green run finishes in ~5 minutes warm, well under 20 cold. Without a cap, a hung
    # step (apt has stalled here for hours) holds the runner until the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # LibRaw is a vendored submodule (crates/core/vendor/LibRaw), built by build.rs.
          submodules: true

      # ChairPhoto compiles its vendored LibRaw at build time (a C++ compiler, zlib and
      # libclang for bindgen) and shells out to the metadata/image tools at runtime. See
      # the Requirements section of the README. The GPUI app links xcb and xkbcommon
      # (`ldd chairphoto`) and probes fontconfig/freetype at build time; it loads
      # Wayland and Vulkan at runtime.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev \
            zlib1g-dev clang pkg-config \
            libimage-exiftool-perl exiv2 ffmpeg imagemagick

      - uses: dtolnay/rust-toolchain@stable
      # The Cargo workspace is the repository root (crates/core, crates/model, crates/app),
      # so the default `. -> target` is the right cache key.
      - uses: Swatinem/rust-cache@v2

      # The model-dependent tests (faces) auto-skip when the ONNX models are absent,
      # so this stays offline-safe on a clean runner.
      - name: Tests
        run: cargo test --workspace

      - name: Check (incl. test-only code)
        run: cargo check --workspace --all-targets

      # AI must stay optional — this is the invariant that keeps the feature gating honest.
      - name: Check without default features
        run: cargo check --workspace --no-default-features

      # Single-feature checks catch hidden coupling between optional backends. Cargo's default
      # and all-feature builds can both pass while `--features smarttags` alone fails. Both
      # packages: the app's check builds the core only as a library, not its test targets.
      - name: Check individual backend features
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          for feature in ai edit raw instagram collage slideshow localsend map faces smarttags flickr smugmug; do
            for pkg in chairphoto-core chairphoto-app; do
              echo "::group::cargo check -p ${pkg} --no-default-features --features ${feature} --all-targets"
              cargo check -p "${pkg}" --no-default-features --features "${feature}" --all-targets
              echo "::endgroup::"
            done
          done

      # tag-graph is app-only (crates/app/Cargo.toml: no matching chairphoto-core feature,
      # it only pulls in tiny-skia for the edge raster), so it runs against chairphoto-app
      # alone rather than joining the loop above, which checks both packages.
      - name: Check the app-only tag-graph feature
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check -p chairphoto-app --no-default-features --features tag-graph --all-targets

      # dev-module is also app-only (crates/app/Cargo.toml, AGENTS.md), same as tag-graph.
      - name: Check the app-only dev-module feature
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check -p chairphoto-app --no-default-features --features dev-module --all-targets

      # The tree is rustc-warning-clean and should stay that way.
      - name: Deny rustc warnings
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets

      # THIRD_PARTY_LICENSES.txt (#244) is committed, not built in packaging/PKGBUILD, so a
      # Cargo.lock change (dependency added/removed/bumped) can land without the notices file
      # that should have come with it. Regenerate into a scratch path with the same command
      # packaging/README.md documents and diff against the committed copy; a real mismatch
      # fails the job rather than shipping a stale notices file. The version pin here is the
      # one the committed file was last generated with (packaging/README.md, "Third-party
      # notices") — bump both together.
      - name: Third-party notices staleness check
        run: |
          cargo install --locked --features cli cargo-about@0.9.2
          cargo about generate about.hbs -m crates/app/Cargo.toml --features flickr,smugmug \
            --locked --fail -o /tmp/THIRD_PARTY_LICENSES.generated.txt
          if ! diff -u THIRD_PARTY_LICENSES.txt /tmp/THIRD_PARTY_LICENSES.generated.txt; then
            echo "::error::THIRD_PARTY_LICENSES.txt is stale. Regenerate it (packaging/README.md, \"Third-party notices\") and commit the result." >&2
            exit 1
          fi

# Note: the `faces-cuda` / `smarttags-cuda` features are deliberately not built here —
# they require an NVIDIA toolchain no standard runner has. Verify those locally with
# `cargo check --workspace --all-features --all-targets`.
