name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  backend:
    name: Backend (tests + feature gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ChairPhoto links LibRaw at build time and shells out to the metadata/image
      # tools at runtime. See the Requirements section of the README.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libraw-dev clang pkg-config \
            libimage-exiftool-perl exiv2 ffmpeg imagemagick

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The model-dependent tests (faces) auto-skip when the ONNX models are absent,
      # so this stays offline-safe on a clean runner.
      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Check (incl. test-only code)
        working-directory: src-tauri
        run: cargo check --all-targets

      # AI must stay optional — this is the invariant that keeps the feature gating honest.
      - name: Check without default features
        working-directory: src-tauri
        run: cargo check --no-default-features

      # Flickr and SmugMug are deliberately NOT in `default`, which means every step above
      # compiles right past them. Without this step a syntax error in src/flickr/ ships green.
      - name: Check opt-in publishing modules
        working-directory: src-tauri
        run: cargo check --all-targets --features flickr,smugmug

      # The tree is rustc-warning-clean and should stay that way.
      - name: Deny rustc warnings
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets

# Note: the `faces-cuda` / `smarttags-cuda` features are deliberately not built here —
# they require an NVIDIA toolchain no standard runner has. Verify those locally with
# `cargo check --all-features --all-targets`.
