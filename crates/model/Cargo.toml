[package]
name = "chairphoto-model"
# Internal crate, never published on its own. Its version is the workspace's single source
# (`[workspace.package] version` at the repository root, #167), which `packaging/PKGBUILD`'s
# `pkgver` must match.
version.workspace = true
publish = false
description = "ChairPhoto's UI model: front-end state and logic as plain Rust, with no GPUI or Tauri types"
authors = ["Andreas Henden <chairman2s.ah+github@gmail.com>"]
license = "GPL-3.0-only"
readme = "../../README.md"
edition = "2021"

# The logic the React front end kept in TypeScript (library session, compare duel, theme
# mapping, …), ported one to one so the GPUI app can drive it and so it stays unit-testable
# without a window. No `gpui*` and no `tauri` dependency: this crate is the seam a GPUI view
# renders from, not a view.
[lib]
name = "chairphoto_model"

[dependencies]
# Only for types that genuinely come from core: the backend DTOs the TypeScript mirrored
# (Photo, PhotoQuery, ImportBatch, StorageStatus, OmarchyPalette, …) and the Darkroom's
# DevelopSource/LensInfo. Default features off: none of those types is feature-gated, and it
# keeps LibRaw, ONNX Runtime and the publishers out of `cargo test -p chairphoto-model`.
chairphoto-core = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Test-only: builds core's render engine so a test can feed it the records this crate writes
# (`plugins::edit::record_engine`). `cargo test -p chairphoto-model --features edit-parity`
# runs it. (It was made opt-in while the Tauri shell assumed core's features equal its own;
# opt-in still keeps the plain model test run free of core's render engine.)
edit-parity = ["chairphoto-core/edit"]
