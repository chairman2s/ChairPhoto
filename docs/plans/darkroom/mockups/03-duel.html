<!doctype html>
<meta charset="utf-8">
<title>Mockup — Duel refinement</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#2d333b; --txt:#e6edf3; --dim:#9da7b3; --accent:#4c8dff; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--txt); font: 13px/1.4 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  .photo { background:
      radial-gradient(120% 90% at 70% 20%, #f7b267 0%, #e8804d 30%, #a1476d 55%, #452a63 80%, #1b1b3a 100%); }

  header { padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 18px; }
  header h1 { font-size: 15px; }
  .rounds { display: flex; gap: 8px; margin-left: 10px; }
  .round { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  .round.done { color: var(--txt); }
  .round.done::before { content: "✓ "; color: #3fb950; }
  .round.on { border-color: var(--accent); color: var(--txt); }
  header .esc { margin-left: auto; color: var(--dim); }

  main { flex: 1; display: flex; gap: 2px; padding: 16px; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
  .pane .img { width: 100%; height: 100%; min-height: 0; border-radius: 8px; }
  .pane .pick { padding: 9px 26px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--txt); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pane:hover .pick { background: var(--accent); border-color: var(--accent); color: #fff; }
  .divider { width: 0; border-left: 1px dashed var(--border); }

  footer { padding: 10px 18px; border-top: 1px solid var(--border); background: var(--panel); display: flex; gap: 14px; align-items: center; color: var(--dim); }
  footer .act { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--txt); cursor: pointer; }
  footer .act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  footer .spacer { flex: 1; }
</style>

<header>
  <h1>⚖ Duel — round 2</h1>
  <div class="rounds">
    <span class="round done">Exposure</span>
    <span class="round on">Warmth</span>
    <span class="round">Contrast</span>
    <span class="round">Shadows</span>
    <span class="round">Look</span>
  </div>
  <span class="esc">Esc — done, keep the standing winner</span>
</header>

<main>
  <div class="pane">
    <div class="img photo" style="filter: brightness(1.1) sepia(.18) saturate(1.12)"></div>
    <button class="pick">← This one</button>
  </div>
  <div class="divider"></div>
  <div class="pane">
    <div class="img photo" style="filter: brightness(1.1) hue-rotate(-8deg)"></div>
    <button class="pick">This one →</button>
  </div>
</main>

<footer>
  <span>Pick with ← / → — each pick narrows the next round. "Same" (↓) skips a dimension.</span>
  <span class="spacer"></span>
  <button class="act">⑂ Keep BOTH as versions</button>
  <button class="act primary">✓ Save as “Warm print”</button>
</footer>
