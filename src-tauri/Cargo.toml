[package]
name = "chairphoto"
version = "2026.8.0"
description = "ChairPhoto — catalog-first photo organizer"
authors = ["Andreas Henden <chairman2s.ah+github@gmail.com>"]
license = "GPL-3.0-only"
readme = "../README.md"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The Tauri shell: `run()`, the command surface (`src/commands/`), the native media protocols
# (`src/protocol.rs`) and the Tauri plugins. Everything else is `chairphoto-core`
# (`crates/core`), which this crate re-exports at its root so `crate::catalog`, `crate::app`
# and friends resolve here exactly as they did before the split (issue #95).
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chairphoto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Optional plugin backends. A feature can be omitted (--no-default-features) to compile that
# plugin's Rust out of the binary entirely. See docs/plugin-system.md. Each one forwards to the
# core crate's feature of the same name, where the backend and its dependencies live — see
# `crates/core/Cargo.toml` for what each pulls in. The shell's own code only registers (or not)
# the matching commands.
#
# The core can have MORE features on than the shell. Cargo unifies a dependency's features
# across everything in one build, so building the shell together with the GPUI app
# (`crates/app`, which forwards the same names) enables on the core whatever either asked for.
# So a shell `#[cfg(feature = "…")]` must never assume the core's feature is off when the
# shell's is: in particular, never match exhaustively on a core enum whose variants the core
# gates (`image_pool::JobKey::Edit`, `CoreEvent`'s plugin events) under the shell's own cfg —
# such matches belong in the core, next to the gate (the pool runner, `media::render_bytes`,
# lives there for this reason). Check with the core's features all on and the shell's off:
#   cargo check -p chairphoto --all-targets --no-default-features \
#     --features chairphoto-core/ai,chairphoto-core/edit,chairphoto-core/raw,…
[features]
default = ["ai", "edit", "raw", "instagram", "collage", "slideshow", "localsend", "map", "faces", "smarttags", "module-fetch"]
ai = ["chairphoto-core/ai"]
# Host-mediated `api.fetch` for modules (#49): one HTTP request made by Rust on a module's
# behalf, to an origin that module declared and the user granted. Not a plugin backend — it is
# part of the module contract — but it is gated like one because `reqwest` is optional and this
# is the only core command that needs an HTTP client. Compiled out, `module_fetch` is not
# registered and the host omits `api.fetch` from the API object it injects, which is the
# documented way an optional host capability is absent (docs/plugin-system.md § Host-API
# stability). See docs/module-capabilities.md § "Host-mediated `api.fetch`". The only feature
# with no core counterpart: the command (`commands/net.rs`) is all there is to it.
module-fetch = ["dep:reqwest"]
localsend = ["chairphoto-core/localsend"]
flickr = ["chairphoto-core/flickr"]
smugmug = ["chairphoto-core/smugmug"]
instagram = ["chairphoto-core/instagram"]
edit = ["chairphoto-core/edit"]
map = ["chairphoto-core/map"]
collage = ["chairphoto-core/collage"]
faces = ["chairphoto-core/faces"]
faces-cuda = ["faces", "chairphoto-core/faces-cuda"]
smarttags = ["chairphoto-core/smarttags"]
smarttags-cuda = ["smarttags", "chairphoto-core/smarttags-cuda"]
slideshow = ["chairphoto-core/slideshow"]
# Full RAW decode via the vendored LibRaw, compiled by the core crate's build.rs
# (crates/core/vendor/LibRaw — `git submodule update --init` after cloning).
raw = ["chairphoto-core/raw"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Features are forwarded one by one above, so the core's defaults stay off here: otherwise
# `--no-default-features` on the shell would still build every backend.
chairphoto-core = { path = "../crates/core", default-features = false }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
image = "0.25"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Only compiled when `module-fetch` is on (`commands/net.rs`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# chairphoto:// OS-level deep links (desktop only): deep-link registers the scheme and
# delivers URLs; single-instance (with its deep-link feature) forwards a second launch's
# URL argv to the running instance on Linux/Windows.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
