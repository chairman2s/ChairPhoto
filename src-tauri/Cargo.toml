[package]
name = "chairphoto"
version = "2026.8.0"
description = "ChairPhoto — catalog-first photo organizer"
authors = ["Andreas Henden <chairman2s.ah+github@gmail.com>"]
license = "GPL-3.0-only"
readme = "../README.md"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chairphoto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Optional plugin backends. A feature can be omitted (--no-default-features) to
# compile that plugin's Rust out of the binary entirely. See docs/plugin-system.md.
[features]
default = ["ai", "edit", "raw", "instagram", "collage", "slideshow", "localsend", "map", "faces", "smarttags", "module-fetch"]
ai = ["dep:reqwest"]
# Host-mediated `api.fetch` for modules (#49): one HTTP request made by Rust on a module's
# behalf, to an origin that module declared and the user granted. Not a plugin backend — it is
# part of the module contract — but it is gated like one because `reqwest` is optional and this
# is the only core command that needs an HTTP client. Compiled out, `module_fetch` is not
# registered and the host omits `api.fetch` from the API object it injects, which is the
# documented way an optional host capability is absent (docs/plugin-system.md § Host-API
# stability). See docs/module-capabilities.md § "Host-mediated `api.fetch`".
module-fetch = ["dep:reqwest"]
# Send a photo to a device on the LAN over LocalSend's documented v2 HTTP protocol (UDP
# multicast discovery + prepare-upload/upload). Send-only. Reuses `reqwest` (HTTP) and the
# already-on tokio "full" (UDP via tokio::net::UdpSocket); `socket2`/`libc` and `rcgen` are
# its only added deps, each commented below. See docs/localsend.md.
localsend = ["dep:reqwest", "dep:socket2", "dep:libc", "dep:rcgen"]
# Publish to Flickr / SmugMug via their official OAuth 1.0a APIs (HMAC-SHA1 signing +
# HTTP upload). Pure-Rust deps, so they compile anywhere. Each is a separate module, and
# neither is in `default` — opt in with `--features flickr,smugmug`.
flickr = ["dep:reqwest", "dep:hmac", "dep:sha1"]
smugmug = ["dep:reqwest", "dep:hmac", "dep:sha1"]
# Browser automation to post an export to Instagram (drives a real Chrome over the
# DevTools Protocol). Needs Chrome/Chromium at runtime. Pure-Rust deps, so it compiles
# anywhere; build without it via `--no-default-features --features ai,edit,raw`.
instagram = ["dep:chromiumoxide", "dep:futures-util", "dep:reqwest"]
# The basic editor's render engine (crop + tone). No extra deps — `image` is already
# a core dependency — so this is purely a compile gate. See docs/editing.md.
edit = []
# The map & geo-tagging module's backend (polygon geofences + Nominatim reverse-geocoder
# with an SQLite cache). Uses `reqwest` for the geocoder HTTP client; Leaflet is a
# frontend-only dep. See docs/map-and-geotagging.md.
map = ["dep:reqwest"]
# The collage compositor (justified-mosaic layout + render). No extra deps — `image`
# is already a core dependency — so this is purely a compile gate. See docs/collage.md.
collage = []
# The face-tagging module's backend (ONNX face detection + recognition). Pulls in `ort`
# (ONNX Runtime) for inference; the runtime shared library is loaded at runtime, not linked,
# so it is an optional dependency the user may not have. Everything ort-related is gated
# behind this feature, so `--no-default-features` stays green on machines without it.
# `reqwest` (already optional) is reused to fetch the model files. See docs/face-tagging.md.
faces = ["dep:ort", "dep:reqwest", "dep:libloading"]
# Optional GPU acceleration for face inference: enables `ort`'s CUDA execution provider
# (NVIDIA GPUs). Additive — implies `faces`. When compiled in, the session builder tries to
# register the CUDA EP and falls back to CPU (never crashing) when the CUDA runtime/cuDNN or a
# GPU is missing; a setting (`faces.force_cpu`) forces CPU even when CUDA is available.
#
# Since ONNX Runtime is now loaded rather than downloaded, whether this actually reaches the
# GPU depends on *which runtime is installed*, not on how the binary was built: a CUDA-enabled
# ONNX Runtime (Arch: onnxruntime-cuda, which provides the same soname as onnxruntime-cpu and
# conflicts with it) registers the EP, and a CPU-only one falls back. The same binary works
# either way. Off by default so the standard build stays CPU-only and portable.
# See docs/face-tagging.md (CUDA section).
faces-cuda = ["faces", "ort/cuda"]
# The Smart Tagging module's backend (local CLIP image embeddings → kNN tag suggestions).
# Like `faces`, it pulls in `ort` (ONNX Runtime) — loaded at runtime rather than linked — and
# reuses `reqwest` (already optional) to fetch the CLIP model on first use. Everything
# ort-related is gated behind this feature so `--no-default-features` stays green. See
# docs/ai-tagging.md (Smart Tagging section).
smarttags = ["dep:ort", "dep:reqwest", "dep:libloading"]
# Optional GPU acceleration for Smart Tagging embedding (NVIDIA CUDA execution provider),
# mirroring `faces-cuda`. Additive — implies `smarttags`. Falls back to CPU (never crashing)
# when the CUDA runtime/cuDNN or a GPU is missing.
smarttags-cuda = ["smarttags", "ort/cuda"]
# The slideshow → movie engine (renders selected photos to an .mp4 via ffmpeg). No extra
# Rust deps — it shells out to the external `ffmpeg` binary (detected on PATH at runtime,
# like exiftool/Chrome) — so this is purely a compile gate. See docs/slideshow.md.
slideshow = []
# Full RAW decode via the system LibRaw (FFI), used for full-resolution edited export
# (docs/editing.md, Phase 3). Needs LibRaw + a working clang/libclang at build time
# (bindgen reads the installed header so the ABI matches exactly). Build without it on
# machines that lack LibRaw: `--no-default-features --features ai,edit`.
raw = []

# Test-only. `hooks` gives rusqlite's authorizer callback, which one identity test uses to
# force a deterministic interleaving between the paged copy query and the per-copy field
# lookup (the alternative is a thread-timing race, which this suite has been burned by).
# Declared here rather than in [dependencies] so the release binary does not carry it —
# verified by inspecting target/release/.fingerprint/rusqlite-*/lib-rusqlite.json.
[dev-dependencies]
rusqlite = { version = "0.31", features = ["hooks"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Only used when the `raw` feature is on (gated inside build.rs by CARGO_FEATURE_RAW);
# they compile regardless but do no work unless invoked.
bindgen = "0.70"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
tokio = { version = "1", features = ["full"] }
image = "0.25"
lru = "0.12"
thiserror = "2"
base64 = "0.22"
xmltree = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Only compiled when the `ai`/`instagram`/`flickr`/`smugmug` feature is on (see [features]).
# Flickr's upload is multipart/form-data, but we build that body by hand (avoids reqwest's
# `multipart` feature and its uncached `mime_guess` dep).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# OAuth 1.0a request signing for the Flickr/SmugMug modules (HMAC-SHA1). Pure Rust.
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
# Only compiled when the `instagram` feature is on (drives Chrome over CDP, on tokio).
chromiumoxide = { version = "0.9", optional = true }
futures-util = { version = "0.3", optional = true }
tauri-plugin-dialog = "2.7.1"
# Only compiled when the `faces` or `smarttags` feature is on. ONNX Runtime bindings for face
# detection (YuNet), embedding (AuraFace), and CLIP image embeddings. 2.0.0-rc line.
#
# `load-dynamic` makes ONNX Runtime a *runtime* dependency rather than a link-time one: the
# binary carries no `libonnxruntime` NEEDED entry and dlopens it on first use instead. That is
# what lets a package list it as an optional dependency, so users who never touch face or
# smart tagging do not install a ~25 MB inference runtime. The default `download-binaries`
# strategy is off deliberately — a build must not fetch an unpinned binary.
#
# The cost is that ort's loader does not fail cleanly when the library is absent: it hangs
# indefinitely with no error. Nothing may call into ort before `plugins::onnx` has confirmed
# the runtime is loadable. See docs/face-tagging.md and packaging/PKGBUILD.
#
# Raising `api-24` needs no matching edit elsewhere: plugins/onnx.rs derives its version floor
# from `ort::MINOR_VERSION`, which is computed from whichever `api-*` feature is enabled here.
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = [
  "load-dynamic",
  "ndarray",
  "tracing",
  "api-24",
] }
# Used only to probe for that runtime before ort touches it (plugins/onnx.rs). ort's own
# loader panics-or-hangs when the library is absent, so the check cannot be delegated to it.
libloading = { version = "0.8", optional = true }
# Data-parallelism for the face-indexing batch (bounded concurrent detect+embed calls).
# The connection-per-worker pattern is avoided: rayon runs the CPU-heavy detect step in
# parallel; DB writes are serialised on the calling thread via a sequential collect pass.
# Used unconditionally (not just under `faces`) so the test suite compiles without the feature.
rayon = "1"
# Only compiled when the `localsend` feature is on. Sets SO_REUSEADDR/SO_REUSEPORT on the
# discovery socket (so it can bind :53317 alongside another LocalSend-speaking process already
# holding it) and IP_MULTICAST_IF per announce (localsend/mod.rs). Already resolved in
# Cargo.lock at 0.6.4 via tokio's and hyper-util's dependency trees (`cargo tree -i socket2`),
# so promoting it to a direct dependency is no new download and no new compile unit — only
# visibility for our own `use socket2::…`.
socket2 = { version = "0.6", optional = true }
# Generates the self-signed TLS *client* certificate we present to LocalSend peers: some
# require one and abort the handshake with `certificate required` without it (issue #56).
# Unlike `socket2`/`libc` this is a genuinely new dependency, so it is trimmed to the two
# features we need — `default-features = false` drops `x509-parser`, which rcgen uses only for
# parsing an existing CA and which alone would pull in asn1-rs/der-parser/oid-registry and
# four more. What remains compiles two new units, `rcgen` and `pem`: its `ring`,
# `rustls-pki-types`, `time` and `base64` are already built for `reqwest`/`rustls`. Shelling
# out to `openssl` instead would make a runtime tool load-bearing for a core send path, which
# the Runtime Notes in AGENTS.md do not allow.
rcgen = { version = "0.14.9", default-features = false, features = ["pem", "ring"], optional = true }

# chairphoto:// OS-level deep links (desktop only): deep-link registers the scheme and
# delivers URLs; single-instance (with its deep-link feature) forwards a second launch's
# URL argv to the running instance on Linux/Windows.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Only compiled when the `localsend` feature is on, on unix (Linux/macOS). `getifaddrs(3)` for
# per-interface multicast join/announce (localsend/mod.rs) — std has no portable interface
# enumeration. Already resolved in Cargo.lock at a single unified version (0.2.186) via
# tokio/mio's dependency tree on every platform (`cargo tree -i libc`), so promoting it to a
# direct dependency here is the same no-new-download/no-new-compile-unit story as `socket2`
# above, just target-scoped since `getifaddrs` isn't a Windows API. Windows falls back to the
# pre-existing `Ipv4Addr::UNSPECIFIED` join (see `local_multicast_interfaces`).
[target."cfg(unix)".dependencies]
libc = { version = "0.2", optional = true }

# Optimize image-decoding crates even in dev builds. Our own code stays in debug
# (fast incremental builds), but decoding a 66 MP embedded RAW preview is ~20x
# slower unoptimized — this brings debug-mode decode close to release speed.
# These dependencies compile once, so the hit to iteration time is negligible.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3

